<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Issue サイドバー モック</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #e6edf3;
      background: #010409;
      --bg: #010409;
      --panel: #0d1117;
      --raised: #161b22;
      --border: #30363d;
      --muted: #8b949e;
      --blue: #2f81f7;
      --green: #238636;
      --purple: #a371f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; background: #010409; }
    button, input, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    .window { width: min(100%, 420px); min-height: 100vh; margin: 0 auto; background: var(--panel); border-inline: 1px solid #21262d; }
    .topbar { height: 42px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: #0d1117; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 650; }
    .brand-mark { display: grid; place-items: center; width: 21px; height: 21px; border-radius: 6px; color: white; background: #8957e5; font-size: 12px; font-weight: 800; }
    .icon-button, .text-button, .primary, .outline { border: 1px solid transparent; border-radius: 6px; background: transparent; }
    .icon-button { min-width: 28px; height: 28px; color: var(--muted); font-size: 17px; }
    .icon-button:hover, .text-button:hover { background: #21262d; color: #fff; }
    .toolbar { padding: 10px 12px 11px; border-bottom: 1px solid var(--border); }
    .toolbar-row { display: flex; gap: 7px; align-items: center; }
    .search { min-width: 0; flex: 1; height: 31px; padding: 0 9px; color: #e6edf3; border: 1px solid var(--border); border-radius: 6px; outline: none; background: #010409; }
    .search:focus, input:focus, textarea:focus { border-color: var(--blue); outline: 1px solid var(--blue); }
    .primary { height: 31px; padding: 0 11px; border-color: #3fb950; background: var(--green); font-weight: 600; }
    .primary:hover { background: #2ea043; }
    .filters { display: flex; gap: 5px; margin-top: 10px; }
    .filter { padding: 4px 9px; border: 1px solid transparent; border-radius: 16px; color: var(--muted); background: transparent; font-size: 12px; }
    .filter.active { color: #e6edf3; border-color: var(--border); background: #21262d; }
    .filter .count { padding-left: 4px; color: #e6edf3; font-weight: 600; }
    .list-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 13px 7px; color: var(--muted); font-size: 11px; }
    .issue-list { padding: 0 8px 14px; }
    .issue-row { display: flex; gap: 10px; padding: 11px 8px; border-bottom: 1px solid #21262d; cursor: pointer; }
    .issue-row:hover { background: #161b22; }
    .state-icon { flex: 0 0 17px; margin-top: 1px; color: #3fb950; font-size: 15px; text-align: center; }
    .state-icon.closed { color: var(--purple); }
    .issue-main { min-width: 0; flex: 1; }
    .issue-title { overflow: hidden; color: #e6edf3; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .issue-meta { display: flex; flex-wrap: wrap; gap: 5px 9px; align-items: center; margin-top: 5px; color: var(--muted); font-size: 11px; }
    .label { display: inline-flex; align-items: center; padding: 2px 7px; border: 1px solid #3d2f64; border-radius: 12px; color: #d2a8ff; background: #211738; font-size: 10px; white-space: nowrap; }
    .label.blue { border-color: #1f4b7a; color: #79c0ff; background: #0c2d4a; }
    .label.yellow { border-color: #6e5715; color: #e3b341; background: #2d2200; }
    .label.green { border-color: #1f5731; color: #7ee787; background: #0d2818; }
    .detail-head { padding: 11px 12px 12px; border-bottom: 1px solid var(--border); }
    .backline { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .back { padding: 4px 0; border: 0; color: var(--blue); background: transparent; }
    .crumb { color: var(--muted); font-size: 11px; }
    .detail-title { margin: 0; font-size: 19px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
    .detail-id { color: var(--muted); font-weight: 400; white-space: nowrap; }
    .detail-sub { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-top: 10px; }
    .detail-description { margin-top: 14px; padding-top: 12px; border-top: 1px solid #21262d; }
    .description-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 600; }
    .detail-description .card-body { font-size: 13px; }
    .status-pill { display: inline-flex; gap: 5px; align-items: center; padding: 4px 9px; border-radius: 16px; color: white; background: var(--green); font-size: 11px; font-weight: 600; }
    .status-pill.closed { background: #8957e5; }
    .sub-count { color: var(--muted); font-size: 11px; }
    .detail-actions { display: flex; gap: 6px; }
    .outline { height: 28px; padding: 0 9px; border-color: var(--border); background: #21262d; font-size: 11px; }
    .outline:hover { border-color: #8b949e; background: #30363d; }
    .timeline { padding: 13px 12px 18px; }
    .timeline-card { position: relative; margin: 0 0 10px 15px; padding: 11px; border: 1px solid var(--border); border-radius: 7px; background: #0d1117; }
    .timeline-card:before { position: absolute; top: 0; bottom: -12px; left: -16px; width: 1px; background: #30363d; content: ""; }
    .timeline-card:last-child:before { bottom: 12px; }
    .timeline-card:after { position: absolute; top: 14px; left: -20px; width: 7px; height: 7px; border: 1px solid #0d1117; border-radius: 50%; background: #6e7681; content: ""; }
    .card-header { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: 10px; }
    .card-kind { color: #e6edf3; font-weight: 600; }
    .card-body { color: #c9d1d9; font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; }
    .card-body h3 { margin: 0 0 6px; color: #e6edf3; font-size: 13px; }
    .card-body p { margin: 5px 0; }
    .card-body ul { margin: 5px 0; padding-left: 18px; }
    .card-body code { padding: 2px 4px; border-radius: 4px; background: #21262d; }
    .comment-compose { margin: 13px 0 0 15px; padding: 10px; border: 1px solid var(--border); border-radius: 7px; background: #0d1117; }
    .compose-title { margin-bottom: 8px; color: #e6edf3; font-size: 11px; font-weight: 600; }
    textarea, input.field { display: block; width: 100%; padding: 9px; border: 1px solid var(--border); border-radius: 6px; color: #e6edf3; background: #010409; resize: vertical; }
    textarea { min-height: 72px; line-height: 1.45; }
    .compose-footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .hint { color: var(--muted); font-size: 10px; }
    .create-page { padding: 12px; }
    .page-title { display: flex; gap: 8px; align-items: center; margin: 0 0 15px; font-size: 15px; font-weight: 600; }
    .field-label { display: block; margin: 12px 0 6px; color: #e6edf3; font-size: 12px; font-weight: 600; }
    .field { height: 35px; }
    .editor-toolbar { display: flex; gap: 2px; align-items: center; height: 33px; padding: 3px 5px; border: 1px solid var(--border); border-bottom: 0; border-radius: 6px 6px 0 0; background: #161b22; }
    .editor-toolbar button { min-width: 25px; height: 24px; border: 0; border-radius: 4px; color: #c9d1d9; background: transparent; }
    .editor-toolbar button:hover { background: #30363d; }
    .editor-toolbar .sep { height: 17px; margin: 0 3px; border-left: 1px solid var(--border); }
    .create-page .editor { min-height: 125px; border-radius: 0 0 6px 6px; }
    .create-actions { display: flex; justify-content: flex-end; gap: 7px; margin: 16px -12px -12px; padding: 10px 12px; border-top: 1px solid var(--border); background: #0d1117; }
    .empty { padding: 42px 20px; color: var(--muted); text-align: center; }
    .toast { position: fixed; right: 16px; bottom: 16px; left: 16px; display: none; padding: 10px 12px; border: 1px solid #238636; border-radius: 7px; color: #e6edf3; background: #0d2818; box-shadow: 0 8px 30px #0008; }
    @media (min-width: 600px) {
      body { padding: 18px; background: #010409; }
      .window { min-height: calc(100vh - 36px); border: 1px solid #30363d; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 40px #0008; }
      .topbar { border-radius: 7px 7px 0 0; }
    }
  </style>
</head>
<body>
  <main class="window" aria-label="Issue sidebar mock">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">#</span><span>Quick Note MD</span><span style="color:#8b949e;font-weight:400">/ Issues</span></div>
      <button class="icon-button" aria-label="更新" title="更新" onclick="renderList()">↻</button>
    </header>
    <div id="app"></div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const issues = [
      { id: 27, title: "Markdownプレビューで日本語の見出しが崩れる", status: "open", labels: [["bug", "yellow"], ["エディター", "blue"]], comments: 2, updated: "12分前", body: "## 現象\n\n日本語を含む見出しを入力すると、プレビューで見出しの位置がずれる。\n\n- 入力中に表示がちらつく\n- 保存後も一部の書式が維持されない\n\n期待する表示に直したい。", thread: [{ kind: "コメント", time: "昨日", body: "日本語IMEの変換中に起きやすいようです。変換確定後もカーソル位置が飛ぶケースがありました。" }, { kind: "コメント", time: "2時間前", body: "見出しだけでなく、箇条書きの連続入力でも再現しました。" }] },
      { id: 26, title: "Issue一覧に状態フィルターを追加する", status: "open", labels: [["機能要望", "blue"]], comments: 1, updated: "1時間前", body: "一覧からOpenとClosedのIssueを切り替えて確認したい。", thread: [{ kind: "コメント", time: "1時間前", body: "状態ごとの件数も一覧に表示できると便利です。" }] },
      { id: 25, title: "初回起動時に旧メモ保存先を整理する", status: "closed", labels: [["移行", "green"]], comments: 1, updated: "昨日", body: "旧メモ・Todo機能からIssue専用画面へ移行する。", thread: [{ kind: "コメント", time: "昨日", body: "旧保存先の整理範囲を仕様に記録しました。" }] },
      { id: 24, title: "サイドバーの狭い幅でも作成フォームを使えるようにする", status: "open", labels: [["UX", "green"]], comments: 0, updated: "2日前", body: "サイドバーの幅が狭い環境でも、タイトル・本文の入力と保存操作ができるようにする。", thread: [] }
    ];
    let page = "list";
    let selected = null;
    let filter = "all";
    let query = "";
    const app = document.getElementById("app");
    const escapeHtml = value => String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    function labelHtml(labels) { return labels.map(([name, color]) => `<span class="label ${color}">${escapeHtml(name)}</span>`).join(""); }
    function visibleIssues() {
      return issues.filter(issue => (filter === "all" || issue.status === filter) && (!query || `${issue.title} ${issue.body}`.toLowerCase().includes(query.toLowerCase())));
    }
    function renderList() {
      page = "list";
      const visible = visibleIssues();
      const openCount = issues.filter(i => i.status === "open").length;
      const closedCount = issues.length - openCount;
      app.innerHTML = `
        <section class="toolbar">
          <div class="toolbar-row">
            <input class="search" aria-label="Issueを検索" placeholder="Issueを検索..." value="${escapeHtml(query)}" oninput="query=this.value;renderListKeepFocus(this.selectionStart)">
            <button class="primary" onclick="page='create';renderCreate()">＋ 新規作成</button>
          </div>
          <nav class="filters" aria-label="Issueの状態">
            <button class="filter ${filter === "all" ? "active" : ""}" onclick="filter='all';renderList()">すべて <span class="count">${issues.length}</span></button>
            <button class="filter ${filter === "open" ? "active" : ""}" onclick="filter='open';renderList()">◉ Open <span class="count">${openCount}</span></button>
            <button class="filter ${filter === "closed" ? "active" : ""}" onclick="filter='closed';renderList()">✓ Closed <span class="count">${closedCount}</span></button>
          </nav>
        </section>
        <div class="list-header"><span>${visible.length} 件のIssue</span><span>更新が新しい順⌄</span></div>
        <section class="issue-list">${visible.length ? visible.map(issue => `
          <article class="issue-row" tabindex="0" role="button" aria-label="${escapeHtml(issue.title)} を開く" onclick="openIssue(${issue.id})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openIssue(${issue.id})}">
            <span class="state-icon ${issue.status === "closed" ? "closed" : ""}">${issue.status === "open" ? "◉" : "✓"}</span>
            <div class="issue-main">
              <div class="issue-title">${escapeHtml(issue.title)}</div>
              <div class="issue-meta"><span>#${issue.id}</span>${labelHtml(issue.labels)}<span>◷ ${issue.updated}</span><span>▤ ${issue.comments}</span></div>
            </div>
          </article>`).join("") : `<div class="empty">一致するIssueがありません</div>`}
        </section>`;
    }
    function renderListKeepFocus(position) {
      renderList();
      const input = app.querySelector(".search");
      input.focus();
      input.setSelectionRange(position, position);
    }
    function openIssue(id) { selected = issues.find(issue => issue.id === id); page = "detail"; renderDetail(); }
    function renderDetail() {
      if (!selected) return renderList();
      const closed = selected.status === "closed";
      app.innerHTML = `
        <section class="detail-head">
          <div class="backline"><button class="back" onclick="renderList()">← Issues</button><span class="crumb">/ #${selected.id}</span></div>
          <h1 class="detail-title">${escapeHtml(selected.title)} <span class="detail-id">#${selected.id}</span></h1>
          <div class="detail-sub">
            <span class="status-pill ${closed ? "closed" : ""}">${closed ? "✓ Closed" : "◉ Open"}</span>
            <span class="sub-count">${selected.comments} 件のコメント</span>
          </div>
          <div class="detail-sub">
            <div style="display:flex;gap:5px;flex-wrap:wrap">${labelHtml(selected.labels)}</div>
            <div class="detail-actions">
              <button class="outline" onclick="toggleStatus()">${closed ? "再オープン" : "Issueをクローズ"}</button>
              <button class="outline" onclick="notify('編集画面のモックは次の段階で追加できます')">…</button>
            </div>
          </div>
          <section class="detail-description" aria-label="Issueの説明">
            <div class="description-label"><span>説明</span><button class="icon-button" aria-label="説明を編集" onclick="notify('説明の編集')">…</button></div>
            <div class="card-body">${selected.body ? markdown(selected.body) : '<span class="hint">説明はありません。</span>'}</div>
          </section>
        </section>
        <section class="timeline" aria-label="Issueのコメント">
          ${selected.thread.map(entry => `<article class="timeline-card"><div class="card-header"><span class="card-kind">${entry.kind}</span><span>${entry.time}</span><button class="icon-button" aria-label="${entry.kind}のメニュー" onclick="notify('カードごとの編集メニュー')">…</button></div><div class="card-body">${markdown(entry.body)}</div></article>`).join("")}
          <form class="comment-compose" onsubmit="addComment(event)">
            <div class="compose-title">コメントを追加</div>
            <textarea id="comment" aria-label="コメント本文" placeholder="コメントを入力..."></textarea>
            <div class="compose-footer"><span class="hint">Markdownに対応</span><button class="primary" type="submit">コメントする</button></div>
          </form>
        </section>`;
    }
    function markdown(source) {
      return escapeHtml(source).split("\n").map(line => {
        if (line.startsWith("## ")) return `<h3>${line.slice(3)}</h3>`;
        if (line.startsWith("- ")) return `<ul><li>${line.slice(2)}</li></ul>`;
        return line ? `<p>${line}</p>` : "";
      }).join("");
    }
    function toggleStatus() {
      selected.status = selected.status === "open" ? "closed" : "open";
      selected.updated = "たった今";
      renderDetail();
      notify("Issueの状態を更新しました");
    }
    function addComment(event) {
      event.preventDefault();
      const field = document.getElementById("comment");
      if (!field.value.trim()) return notify("コメントを入力してください");
      selected.thread.push({ kind: "コメント", time: "たった今", body: field.value });
      selected.comments++;
      selected.updated = "たった今";
      renderDetail();
      notify("コメントを追加しました");
    }
    function renderCreate() {
      app.innerHTML = `
        <section class="create-page">
          <div class="backline"><button class="back" onclick="renderList()">← キャンセル</button><span class="crumb">/ 新しいIssue</span></div>
          <h1 class="page-title"><span style="color:#3fb950">◉</span> 新しいIssue</h1>
          <form onsubmit="createIssue(event)">
            <label class="field-label" for="new-title">タイトル *</label>
            <input class="field" id="new-title" placeholder="Issueのタイトル" required>
            <label class="field-label" for="new-body">説明 <span style="color:#8b949e;font-weight:400">(任意)</span></label>
            <div class="editor-toolbar" aria-label="Markdown書式">
              <button type="button" title="見出し">H⌄</button><button type="button" title="太字"><b>B</b></button><button type="button" title="斜体"><i>I</i></button><button type="button" title="引用">❞</button><button type="button" title="コード">&lt;/&gt;</button><button type="button" title="リンク">↗</button><span class="sep"></span><button type="button" title="箇条書き">☷</button><button type="button" title="番号付きリスト">1.</button>
            </div>
            <textarea class="editor" id="new-body" placeholder="説明を入力...&#10;&#10;Markdownで記述できます"></textarea>
            <div class="create-actions"><button class="outline" type="button" onclick="renderList()">キャンセル</button><button class="primary" type="submit">Issueを作成</button></div>
          </form>
        </section>`;
    }
    function createIssue(event) {
      event.preventDefault();
      const title = document.getElementById("new-title").value.trim();
      if (!title) return notify("タイトルを入力してください");
      const issue = { id: Math.max(...issues.map(i => i.id), 0) + 1, title, status: "open", labels: [], comments: 0, updated: "たった今", body: document.getElementById("new-body").value, thread: [] };
      issues.unshift(issue);
      selected = issue;
      page = "detail";
      renderDetail();
      notify("Issueを作成しました");
    }
    function notify(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.display = "block";
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toast.style.display = "none", 2200);
    }
    renderList();
  </script>
</body>
</html>
